name: Native dashboard
on:
  push:
    branches: ['main']
    paths: ['native/**', 'tools/prepare_native.py', 'tools/import_dat.py', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'tools/prepare_native.py', 'tools/import_dat.py', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable scan and dashboard
        run: cc -shared -fPIC -O2 -std=c11 -Wall -Wextra -Werror native/source/cartverity_scan.c native/source/cartverity_ui.c native/source/cartverity_display.c native/source/cartverity_database.c -o /tmp/cartverity.so
      - name: Exercise native scan and drawing callbacks
        run: python3 native/tests/test_native.py /tmp/cartverity.so
  firmware:
    needs: host
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install firmware packager
        run: |
          apt-get update
          apt-get install -y python3 python3-venv git make
          python3 -m venv /tmp/cartverity-venv
          /tmp/cartverity-venv/bin/pip install 'cryptography==46.0.3' 'git+https://github.com/TuxSH/firmtool.git@fdc7085c2394d87ce5dbdfecdf51423e1e7b00a1'
          echo /tmp/cartverity-venv/bin >> "$GITHUB_PATH"
      - name: Prepare verified upstream and complete corresponding source
        run: |
          python3 tools/prepare_native.py --out build/godmode9
          mkdir -p dist/native
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version > build/godmode9/CartVerity-build-environment.txt
          python3 --version >> build/godmode9/CartVerity-build-environment.txt
          python3 -m pip freeze >> build/godmode9/CartVerity-build-environment.txt
          python3 -c "import shutil; shutil.make_archive('dist/native/CartVerity-corresponding-source', 'zip', 'build', 'godmode9')"
          cp docs/RELEASE_README.md dist/native/README.md
          python3 -c "from zipfile import ZipFile; files=['tools/import_dat.py','tools/make_reference.py','docs/REFERENCES.md','docs/REFERENCE_DATABASE_FORMAT.md','docs/REFERENCE_SOURCES.md','LICENSE']; z=ZipFile('dist/native/CartVerity-reference-tools.zip','w'); [z.write(p,p) for p in files]; z.close()"
      - name: Build standalone ARM payload
        working-directory: build/godmode9
        run: make firm CARTVERITY_APP=1 VERSION=CartVerity-v0.2.0-alpha.5 -j2
      - name: Audit active cartridge initializer
        run: |
          cd build/godmode9
          "$DEVKITARM/bin/arm-none-eabi-gcc" -E -DARM9 -DCARTVERITY_APP -Icommon $(find arm9/source -type d -printf '-I%p ') arm9/source/gamecart/gamecart.c > /tmp/cartverity-gamecart.i
          cd ../..
          python3 native/tests/audit_initializer.py /tmp/cartverity-gamecart.i
      - name: Package and checksum
        run: |
          cp build/godmode9/output/GodMode9.firm dist/native/CartVerity.firm
          cd dist/native
          sha256sum CartVerity.firm CartVerity-corresponding-source.zip CartVerity-reference-tools.zip README.md > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CartVerity-native-experimental
          path: dist/native/*
          if-no-files-found: error

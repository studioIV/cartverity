name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate script
        run: python tools/gm9check.py gm9/scripts/CartVerity.gm9
      - name: Test scenarios and reference helper
        run: python -m unittest discover -s tests -v
      - name: Check pinned upstream source
        run: python tools/check_upstream.py
